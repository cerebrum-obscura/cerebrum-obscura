  const path = location.pathname.replace(/\/+$/, '');
  if (!path.endsWith('/archive')) return;
  if (document.querySelector('.co-archive')) return;

  const base = path.slice(0, -'/archive'.length);
  const siteRoot = location.origin + base + '/';

  const escapeHTML = value =>
    String(value).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

  const target =
    document.querySelector('main .content') ||
    document.querySelector('main .post__content') ||
    document.querySelector('main .page__content') ||
    document.querySelector('main .wrapper') ||
    document.querySelector('main');

  if (!target) return;

  const archive = document.createElement('section');
  archive.className = 'co-archive';

  archive.innerHTML = `
    <div class="co-archive__eyebrow">
      <span>　</span>
      <span>CHRONOLOGICAL RECORD</span>
    </div>

    <header class="co-archive__header">
      <h1 class="co-archive__title">The Archive</h1>
      <p class="co-archive__intro">
        An inventory of passing thoughts.
      </p>
    </header>

    <div class="co-archive__records">
      <p class="co-archive__status">
        Retrieving the collection…
      </p>
    </div>

    <footer class="co-archive__footer">
      <span>ARCHIVE OF THE HUMAN CONDITION</span>
      <span>001 — ∞</span>
    </footer>
  `;

  target.replaceChildren(archive);

  const records = archive.querySelector('.co-archive__records');

  function formatDate(date) {
    return date.toLocaleDateString('en-GB', {
      day: '2-digit',
      month: 'short',
      timeZone: 'UTC'
    }).toUpperCase();
  }

  function getAtomText(entry, name) {
    const elements = entry.getElementsByTagNameNS(
      'http://www.w3.org/2005/Atom',
      name
    );
    return elements[0]?.textContent?.trim() || '';
  }

  try {
    const response = await fetch(
      new URL('feed.xml', siteRoot)
    );

    if (!response.ok) {
      throw new Error('Feed HTTP ' + response.status);
    }

    const xml = new DOMParser().parseFromString(
      await response.text(),
      'application/xml'
    );

    if (xml.querySelector('parsererror')) {
      throw new Error('Invalid Atom XML');
    }

    const ns = 'http://www.w3.org/2005/Atom';

    const entries = [
      ...xml.getElementsByTagNameNS(ns, 'entry')
    ];

    const posts = entries.map(entry => {
      const title = getAtomText(entry, 'title');

      const links = [
        ...entry.getElementsByTagNameNS(ns, 'link')
      ];

      const linkElement =
        links.find(link =>
          link.getAttribute('rel') === 'alternate'
        ) ||
        links.find(link =>
          !link.getAttribute('rel')
        ) ||
        links[0];

      const link = linkElement?.getAttribute('href') || '';

      const dateString =
        getAtomText(entry, 'published') ||
        getAtomText(entry, 'updated');

      const date = new Date(dateString);

      if (!title || !link || isNaN(date.getTime())) {
        return null;
      }

      // Exclude the image-storage post.
      if (title.trim().toLowerCase() === 'for index') {
        return null;
      }

      let url;

      try {
        url = new URL(link, siteRoot);
        if (url.origin !== location.origin) return null;
      } catch (e) {
        return null;
      }

      return {
        title,
        url: url.href,
        date
      };
    }).filter(Boolean);

    posts.sort((a, b) => b.date - a.date);

    if (!posts.length) {
      records.innerHTML = `
        <p class="co-archive__status">
          No published posts found.
        </p>
      `;
      return;
    }

    const grouped = {};

    posts.forEach(post => {
      const year = post.date.getUTCFullYear();
      (grouped[year] ||= []).push(post);
    });

    records.innerHTML = Object.keys(grouped)
      .sort((a, b) => Number(b) - Number(a))
      .map(year => `
        <section class="co-archive__year">
          <div class="co-archive__year-label">
            <span class="co-archive__year-number">
              ${year}
            </span>
            <span class="co-archive__year-note">
              ${grouped[year].length} ENTRIES
            </span>
          </div>

          <div class="co-archive__entries">
            ${grouped[year].map(post => `
              <a
                class="co-archive__entry"
                href="${escapeHTML(post.url)}"
              >
                <span class="co-archive__date">
                  ${formatDate(post.date)}
                </span>

                <span class="co-archive__entry-title">
                  ${escapeHTML(post.title)}
                </span>

                <span class="co-archive__entry-arrow">
                  ↗
                </span>
              </a>
            `).join('')}
          </div>
        </section>
      `).join('');

  } catch (error) {
    console.error('ARCHIVE ATOM ERROR:', error);

    records.innerHTML = `
      <p class="co-archive__status">
        The archive could not be loaded.
        Please check the Atom feed.
      </p>
    `;
  }
